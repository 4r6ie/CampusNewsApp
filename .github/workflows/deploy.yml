name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/campus-news-api:${{ github.ref_name }}
          platforms: linux/amd64

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            IMAGE=${{ secrets.REGISTRY_URL }}/campus-news-api:${{ github.ref_name }} docker compose up -d --build api

      - name: Smoke test
        run: |
          sleep 20
          curl -fsS ${{ secrets.APP_HEALTH_URL }} || exit 1