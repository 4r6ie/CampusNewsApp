name: Flutter CI

on:
  push:
    paths:
      - "apps/mobile/**"
  pull_request:
    paths:
      - "apps/mobile/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile/flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile/flutter_app
        run: flutter analyze

      - name: Run tests
        working-directory: apps/mobile/flutter_app
        run: flutter test